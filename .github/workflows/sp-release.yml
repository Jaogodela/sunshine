---
name: SP-Release

# Additive release workflow for the Gaspar fork. It never runs the upstream
# release jobs. Tags look like v2026.914.233613-sp.0.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*-sp.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (must match v*-sp.*)'
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  DOCKERFILE: docker/sp-ubuntu-24.04.dockerfile
  IMAGE_NAME: ghcr.io/jaogodela/sunshine

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      build_version: ${{ steps.version.outputs.build_version }}
      commit: ${{ steps.version.outputs.commit }}
      deb_release: ${{ steps.version.outputs.deb_release }}
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Validate tag and compute version
        id: version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-sp\.[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Tag '${tag}' does not match v<upstream>-sp.<n>"
            exit 1
          fi

          version_full="${tag#v}"
          base_version="$(grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' <<<"${version_full}")"
          suffix="${version_full#"${base_version}"-}"

          {
            echo "tag=${tag}"
            echo "artifact_version=${version_full}"
            echo "build_version=${base_version}"
            echo "commit=$(git rev-parse HEAD)"
            echo "deb_release=${suffix}+ubuntu24.04"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "${GITHUB_OUTPUT}"

  release:
    name: Build and release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      id-token: write   # cosign keyless OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Test (Xvfb, no GPU)
        run: |
          docker buildx build \
            --file "${DOCKERFILE}" \
            --platform linux/amd64 \
            --target sunshine-test \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }} \
            --build-arg BUILD_VERSION=${{ needs.prepare.outputs.build_version }} \
            --build-arg ARTIFACT_VERSION=${{ needs.prepare.outputs.artifact_version }} \
            --build-arg DEB_RELEASE=${{ needs.prepare.outputs.deb_release }} \
            --build-arg COMMIT=${{ needs.prepare.outputs.commit }} \
            --build-arg BRANCH=${{ needs.prepare.outputs.tag }} \
            .

      - name: Build .deb and tarball
        run: |
          mkdir -p out
          docker buildx build \
            --file "${DOCKERFILE}" \
            --platform linux/amd64 \
            --target artifacts \
            --output type=local,dest=out \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }} \
            --build-arg BUILD_VERSION=${{ needs.prepare.outputs.build_version }} \
            --build-arg ARTIFACT_VERSION=${{ needs.prepare.outputs.artifact_version }} \
            --build-arg DEB_RELEASE=${{ needs.prepare.outputs.deb_release }} \
            --build-arg COMMIT=${{ needs.prepare.outputs.commit }} \
            --build-arg BRANCH=${{ needs.prepare.outputs.tag }} \
            .

      - name: Checksums
        run: |
          set -euo pipefail
          (cd out/artifacts && sha256sum ./*.deb ./*.tar.gz) > out/SHA256SUMS
          cat out/SHA256SUMS

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.20.0

      - name: Generate SBOM
        run: |
          syft dir:out/artifacts -o spdx-json=out/SBOM.spdx.json
          test -s out/SBOM.spdx.json

      - name: Login to GHCR
        # Needs actions permissions to create packages on the fork. On the very
        # first publish, make the package public and linked to this repository.
        run: |
          echo "${{ github.token }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push build image
        id: push
        run: |
          set -euo pipefail
          docker buildx build \
            --file "${DOCKERFILE}" \
            --platform linux/amd64 \
            --target ci-image \
            --tag "${IMAGE_NAME}:${{ needs.prepare.outputs.artifact_version }}" \
            --push \
            --metadata-file out/image-metadata.json \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }} \
            --build-arg BUILD_VERSION=${{ needs.prepare.outputs.build_version }} \
            --build-arg ARTIFACT_VERSION=${{ needs.prepare.outputs.artifact_version }} \
            --build-arg DEB_RELEASE=${{ needs.prepare.outputs.deb_release }} \
            --build-arg COMMIT=${{ needs.prepare.outputs.commit }} \
            --build-arg BRANCH=${{ needs.prepare.outputs.tag }} \
            .
          digest="$(jq -r '."containerimage.digest" // empty' out/image-metadata.json)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${IMAGE_NAME}@${digest}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign build image (keyless)
        if: steps.push.outputs.digest != ''
        run: |
          cosign sign --yes \
            "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          files=(
            out/artifacts/*.deb
            out/artifacts/*.tar.gz
            out/SHA256SUMS
            out/SBOM.spdx.json
          )
          notes="Gaspar fork build of Sunshine ${TAG}. Artifacts are built from the same commit and SOURCE_DATE_EPOCH as SP-CI. GPU/NVENC/VAAPI encode validation is manual and must be repeated on the owner's WSL machine; a green workflow only means the software built and its unit tests passed without a GPU. See docs/sp/README.md and docs/sp/reproducibility.md."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" \
              --title "${TAG}" \
              --prerelease \
              --latest=false \
              --notes "${notes}"
          fi
